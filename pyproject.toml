readme = "README.md"
authors = [
    { name = "Hari Krishnan", email = "144345505+CodeHariK@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "notebook>=7.6.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
